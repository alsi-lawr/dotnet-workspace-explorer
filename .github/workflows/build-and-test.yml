name: build and test Workspace Explorer

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.300
      - name: Restore local tools and solution
        run: |
          dotnet tool restore
          dotnet restore Dotnet.WorkspaceExplorer.slnx
      - name: Build Debug and Release
        shell: pwsh
        run: |
          dotnet build Dotnet.WorkspaceExplorer.slnx --configuration Debug --no-restore
          dotnet build Dotnet.WorkspaceExplorer.slnx --configuration Release --no-restore
      - name: Run RPC unit tests (Debug)
        working-directory: tests/unit/Rpc/bin/Debug/net10.0
        run: dotnet Dotnet.WorkspaceExplorer.Rpc.UnitTests.dll --fail-skips on
      - name: Run workspace unit tests (Debug)
        working-directory: tests/unit/Workspaces/bin/Debug/net10.0
        run: dotnet Dotnet.WorkspaceExplorer.Workspaces.UnitTests.dll --fail-skips on
      - name: Run project evaluation integration tests (Debug)
        working-directory: tests/integration/ProjectEvaluation/bin/Debug/net10.0
        run: dotnet Dotnet.WorkspaceExplorer.ProjectEvaluation.IntegrationTests.dll --fail-skips on
      - name: Run workspace integration tests (Debug)
        working-directory: tests/integration/Workspaces/bin/Debug/net10.0
        run: dotnet Dotnet.WorkspaceExplorer.Workspaces.IntegrationTests.dll --fail-skips on
      - name: Run RPC unit tests (Release)
        working-directory: tests/unit/Rpc/bin/Release/net10.0
        run: dotnet Dotnet.WorkspaceExplorer.Rpc.UnitTests.dll --fail-skips on
      - name: Run workspace unit tests (Release)
        working-directory: tests/unit/Workspaces/bin/Release/net10.0
        run: dotnet Dotnet.WorkspaceExplorer.Workspaces.UnitTests.dll --fail-skips on
      - name: Run project evaluation integration tests (Release)
        working-directory: tests/integration/ProjectEvaluation/bin/Release/net10.0
        run: dotnet Dotnet.WorkspaceExplorer.ProjectEvaluation.IntegrationTests.dll --fail-skips on
      - name: Run workspace integration tests (Release)
        working-directory: tests/integration/Workspaces/bin/Release/net10.0
        run: dotnet Dotnet.WorkspaceExplorer.Workspaces.IntegrationTests.dll --fail-skips on
      - name: Check formatting
        run: |
          dotnet fantomas --check .
          dotnet csharpier check src/ProjectEvaluation
